<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Board</title>

<!-- CSS -->
<link rel="stylesheet" href="vs.css">

<!-- html2canvas CDN -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- JS -->
<script src="visionboard.js" defer></script>
</head>
<body>

<h1>Student Fun Zone - Vision Board</h1>

<div class="toolbar">
  <button id="addNoteBtn">+ Post It</button>
  <button id="addImageBtn">+ Slika</button>
  <button id="addQuoteBtn">+ Citat</button>
  <button id="saveBtn">+ Snimi</button>
  <button id="clearBtn">+ Očisti</button>
  <button id="pdfBtn">Snimi kao PDF/Slika</button>
  <button id="mailBtn">Pošalji mailom</button>
</div>

<div id="board"></div>

<footer>
  <p>Web programiranje 2025 &copy; Internacionalna poslovno-informaciona akademija Tuzla</p>
</footer>

<div id="popup" aria-hidden="true">
  <div class="popup">
    <h3>Pošalji mail</h3>
    <input type="email" id="emailInput" placeholder="Unesite email">
    <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
      <button id="sendEmail">Pošalji</button>
      <button id="cancelEmail">Poništi</button>
    </div>
    
  </div>
</div>

</body>
</html>
