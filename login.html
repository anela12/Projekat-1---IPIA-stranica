<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <title>Login / Register</title>
  <link rel="stylesheet" href="login.css">
<script src="login.js" defer></script>
</head>
<body>

<div class="auth-box">
  <div class="tabs">
    <button id="loginTab" class="active" onclick="showForm('login')">Login</button>
    <button id="registerTab" onclick="showForm('register')">Register</button>
  </div>

  
  <form id="loginForm" class="active">
    <h3>Login</h3>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="button" onclick="login()">Login</button>
  </form>

 
  <form id="registerForm">
    <h3>Register</h3>
    <input type="text" id="regName" placeholder="Ime" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <label for="theme">Izaberite temu:</label>
    <select id="theme">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="lila">Lila</option>
    </select>
    <button type="button" onclick="register()">Register</button>
  </form>
</div>

<script src="login.js"></script>
</body>
</html>
