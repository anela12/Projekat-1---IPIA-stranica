<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="javascript.js" defer></script>
<title>Interaktivni Whiteboard</title>
</head>

<body>

<h1>
  <img src="marker.png" alt="Marker" style="width:40px; vertical-align:middle; margin-right:10px;">
  Interaktivni Whiteboard
</h1>

<div class="toolbar">
<label for= "colorPicker">Boja:</label>
<input type="color" id="colorPicker" value="#000000">

<label for= "brushSize"> Četka:</label>
<input type="range" id="brushSize" min="1" max="20" value="3">

<button id="eraserBtn">Briši</button>
<button id="clearBtn">Čista ploča</button>
<button id="saveBtn">Snimi</button>
</div>

<canvas id="board" width="900" height="500"></canvas>

<footer>
Web programiranje 2025 &copy Internacionalna poslovno-informaciona akademija Tuzla
</footer>



</body>
</html>
